<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0f0e17">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SE9SKD2F92"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>恋愛モンスター診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0f0e17;
    --bg-card: #1a1825;
    --bg-hover: #252235;
    --accent-pink: #ff5277;
    --accent-sub: #705df2;
    --text-primary: #fffffe;
    --text-secondary: #a7a9be;
    --border: rgba(255, 255, 255, 0.08);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { background-color: var(--bg-main); }

  body {
    margin: 0; padding: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: 'Zen Kaku Gothic New', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }

  .stage {
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
  }

  .screen { display: none; }
  .screen.active {
    display: block;
    animation: fadeIn .3s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Top / Start ---------- */
  .badge {
    display: inline-block;
    padding: 6px 12px;
    background: rgba(112, 93, 242, 0.15);
    color: #9d8ecf;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 16px;
  }

  h1.title {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.3;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  p.lead {
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 28px;
  }

  .axis-container {
    display: flex;
    gap: 6px;
    margin-bottom: 32px;
  }

  .axis-tag {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 52px;
    border: none;
    background: var(--accent-pink);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: opacity .15s ease, transform .1s ease;
  }
  .btn-primary:active { opacity: 0.85; transform: scale(0.98); }

  .btn-secondary {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 48px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 500;
    border-radius: var(--radius-md);
    cursor: pointer;
    margin-top: 10px;
  }
  .btn-secondary:active { background: var(--bg-hover); }

  /* ---------- Question ---------- */
  .progress-bar {
    height: 4px;
    background: var(--bg-card);
    border-radius: 99px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent-pink);
    width: 0%;
    transition: width .25s ease;
  }

  .q-counter {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px;
    color: var(--accent-pink);
    font-weight: 700;
    margin-bottom: 8px;
  }

  .q-text {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.5;
    margin: 0 0 24px;
  }

  .option-btn {
    width: 100%;
    text-align: left;
    padding: 16px;
    margin-bottom: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: 14.5px;
    line-height: 1.5;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .option-btn:active {
    background: var(--bg-hover);
    border-color: rgba(255, 82, 119, 0.4);
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 13px;
    padding: 12px 0;
    margin-top: 8px;
    cursor: pointer;
  }

  /* ---------- Loading ---------- */
  .loading-box {
    text-align: center;
    padding: 40px 0;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent-pink);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Result ---------- */
  .result-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px 20px;
    text-align: center;
  }

  .monster-img {
    width: 160px;
    height: 160px;
    object-fit: contain;
    margin: 0 auto 12px;
    display: block;
  }

  .type-code {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-pink);
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }

  .result-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 14px;
  }

  .result-desc {
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.75;
    text-align: left;
    margin: 0 0 20px;
  }

  .compat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .compat-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    text-align: left;
  }

  .compat-label {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .compat-val {
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.4;
  }

  .promo-card {
    background: linear-gradient(135deg, rgba(112, 93, 242, 0.12), rgba(255, 82, 119, 0.12));
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 20px;
    text-align: left;
  }

  .promo-title {
    font-size: 13px;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .promo-desc {
    font-size: 12px;
    color: var(--text-secondary);
    margin: 0 0 12px;
  }

  .share-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }

  .share-btn {
    height: 40px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 20px;
    opacity: 0.6;
  }
</style>
</head>
<body>

<div id="app">
  <div class="stage">

    <!-- START -->
    <section class="screen active" id="screen-start">
      <div style="text-align: center;">
        <span class="badge">16 Personality Quiz</span>
        <h1 class="title">恋愛モンスター診断</h1>
        <p class="lead">12の質問から、あなたの恋愛スタイルと隠された性格タイプを分析します。</p>
      </div>

      <div class="axis-container">
        <div class="axis-tag">E / I</div>
        <div class="axis-tag">S / N</div>
        <div class="axis-tag">T / F</div>
        <div class="axis-tag">J / P</div>
      </div>

      <button class="btn-primary" id="btn-start">診断をはじめる</button>
    </section>

    <!-- QUESTION -->
    <section class="screen" id="screen-question">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      
      <div class="q-counter" id="q-counter">Q.01</div>
      <div class="q-text" id="q-text">質問テキスト</div>

      <button class="option-btn" id="opt-a">選択肢A</button>
      <button class="option-btn" id="opt-b">選択肢B</button>

      <button class="back-btn" id="btn-back">← ひとつ前へ戻る</button>
    </section>

    <!-- LOADING -->
    <section class="screen" id="screen-loading">
      <div class="loading-box">
        <div class="spinner"></div>
        <p style="font-size: 14px; color: var(--text-secondary);">結果を分析中...</p>
      </div>
    </section>

    <!-- RESULT -->
    <section class="screen" id="screen-result">
      <div class="result-card">
        <img id="monster-image" src="" alt="" class="monster-img">
        <div class="type-code" id="result-type-code">TYPE : ----</div>
        <h2 class="result-title" id="result-name">---</h2>
        <p class="result-desc" id="result-desc">---</p>

        <div class="compat-grid">
          <div class="compat-item">
            <div class="compat-label">相性が良いタイプ</div>
            <div class="compat-val" id="result-compat-good">---</div>
          </div>
          <div class="compat-item">
            <div class="compat-label">すれ違いやすいタイプ</div>
            <div class="compat-val" id="result-compat-bad">---</div>
          </div>
        </div>

        <div class="promo-card">
          <div class="promo-title">魅力を引き出すプロフィール写真</div>
          <div class="promo-desc">あなたのタイプに合わせた自然な写真をプロが撮影。</div>
          <button class="btn-primary" id="affiliate-btn" style="height: 40px; font-size: 13px;">詳細を見る</button>
        </div>

        <div class="share-grid">
          <button class="share-btn" id="btn-share-x" style="background: #000;">Xで共有</button>
          <button class="share-btn" id="btn-share-line" style="background: #06C755;">LINE</button>
          <button class="share-btn" id="btn-share-insta" style="background: #262626;">Insta用にコピー</button>
        </div>

        <button class="btn-secondary" id="btn-retry">もう一度診断する</button>
      </div>

      <footer>※エンタメ目的の診断コンテンツです</footer>
    </section>

  </div>
</div>

<script>
(function(){
  var QUESTIONS = [
    { text: "気になる人ができたら、まず取る行動は？", a: { text: "自分から積極的に話しかけて距離を縮める", letter: "E" }, b: { text: "相手の様子を見ながら慎重に機会を伺う", letter: "I" } },
    { text: "休日、気になる人を誘うなら？", a: { text: "イベントやお店など、賑やかな場所", letter: "E" }, b: { text: "カフェや落ち着いた空間でじっくり話せる場所", letter: "I" } },
    { text: "恋愛で少し疲れてしまった時は？", a: { text: "信頼できる友達に話を聞いてもらう", letter: "E" }, b: { text: "ひとりの時間をつくってリフレッシュする", letter: "I" } },

    { text: "相手に惹かれるポイントは？", a: { text: "立ち振る舞いや会話のテンポなど具体的な魅力", letter: "S" }, b: { text: "雰囲気や価値観など、感覚的なフィット感", letter: "N" } },
    { text: "デートの行き先を決めるなら？", a: { text: "評判が良い安心できる定番スポット", letter: "S" }, b: { text: "あまり知られていない隠れ家的なお店", letter: "N" } },
    { text: "ふたりの将来について話すときは？", a: { text: "生活スタイルなど現実的なイメージを大切にする", letter: "S" }, b: { text: "「こうなったら良いな」という理想を語り合う", letter: "N" } },

    { text: "パートナーと意見が食い違った時は？", a: { text: "何が問題なのか論理的に整理して話し合う", letter: "T" }, b: { text: "お互いの気持ちや感情を優先して歩み寄る", letter: "F" } },
    { text: "恋人から悩み相談を受けた時は？", a: { text: "具体的にどう解決するかアイデアを出す", letter: "T" }, b: { text: "まずは共感して相手の思いを受け止める", letter: "F" } },
    { text: "自分の気持ちを伝えるタイミングは？", a: { text: "状況やタイミングを冷静に見極めてから", letter: "T" }, b: { text: "自分の素直な感情がのった瞬間に伝える", letter: "F" } },

    { text: "デート当日の進め方は？", a: { text: "事前にしっかり行き先や時間スケジュールを決めておく", letter: "J" }, b: { text: "大まかなエリアだけ決めて、あとは気分で動く", letter: "P" } },
    { text: "日常の連絡スピードは？", a: { text: "できるだけ一定のリズムでマメに返したい", letter: "J" }, b: { text: "手の空いた時間や気が向いた時に自由に返したい", letter: "P" } },
    { text: "恋愛における居心地の良さとは？", a: { text: "お互いのペースが確立されていて見通しが立つこと", letter: "J" }, b: { text: "その時々の変化や予想外の展開を楽しめること", letter: "P" } }
  ];

  var MONSTERS = {
    INTJ: { name: "孤高の戦略ウルフ", image: "images/wolf.png", desc: "自分の軸をしっかり持った理性的で慎重なタイプ。打ち解けるまでに時間はかかりますが、一度信頼した相手には揺るぎない誠実さを見せます。", compat: "ENFP（かまってちゃんウサギ）", badCompat: "ESFP（パリピカワウソ）" },
    ENFP: { name: "かまってちゃんウサギ", image: "images/rabbit.png", desc: "愛嬌があり感情表現豊かなタイプ。素直なアプローチで周囲を明るくしますが、寂しがり屋な一面も持ち合わせています。", compat: "INFJ（達観ペンギン）", badCompat: "ISTJ（まじめタートル）" },
    INTP: { name: "引きこもりフクロウ", image: "images/owl.png", desc: "独自の視点と深い思考力を持つマイペース派。自分の興味があるテーマにはとことんこだわり抜きます。", compat: "ENTJ（暴君ライオン）", badCompat: "ESFJ（社交的キャット）" },
    ENTJ: { name: "暴君ライオン", image: "images/lion.png", desc: "目標に向かってまっすぐ突き進むリーダータイプ。頼りがいがありますが、少しこだわりが強くなりすぎることも。", compat: "INTP（引きこもりフクロウ）", badCompat: "ISFP（気まぐれパンダ）" },
    ENTP: { name: "ひねくれキツネ", image: "images/fox.png", desc: "ウィットに富んだ会話が得意なアイデアマン。あえて意地悪な質問をして相手のリアクションを楽しむ無邪気さがあります。", compat: "INFJ（達観ペンギン）", badCompat: "ISFJ（尽くしすぎクマ）" },
    INFJ: { name: "達観ペンギン", image: "images/penguin.png", desc: "相手の繊細な心情の変化を感じ取る落ち着いたタイプ。静かですが、心の中には深い情熱を秘めています。", compat: "ENFP（かまってちゃんウサギ）", badCompat: "ESTP（ウェイウェイドラゴン）" },
    INFP: { name: "メンヘラコウモリ", image: "images/bat.png", desc: "感性豊かなロマンチスト。独自の世界観を大切にし、相手との心の深いつながりを何よりも求める傾向があります。", compat: "ENFJ（おせっかいイヌ）", badCompat: "ESTJ（毒舌ゴリラ）" },
    ENFJ: { name: "おせっかいイヌ", image: "images/dog.png", desc: "情に厚く、周りの人の幸せを親身になって考えられるタイプ。困っている人を見過ごせない温かさを持っています。", compat: "INFP（メンヘラコウモリ）", badCompat: "ISTP（マイペースネコ）" },
    ISTJ: { name: "まじめタートル", image: "images/turtle.png", desc: "誠実で責任感が強く、着実に信頼関係を築くタイプ。約束を厳守し、相手に安心感を与えます。", compat: "ESFP（パリピカワウソ）", badCompat: "ENFP（かまってちゃんウサギ）" },
    ISFJ: { name: "尽くしすぎクマ", image: "images/bear.png", desc: "相手をそっとサポートする平和主義者。相手の喜ぶ顔を見るのが自分の幸せに感じる優しい性格です。", compat: "ESTP（ウェイウェイドラゴン）", badCompat: "INTP（引きこもりフクロウ）" },
    ESTJ: { name: "毒舌ゴリラ", image: "images/gorilla.png", desc: "現実的で頼りになるしっかり者。自分の意見をはっきり伝えられる芯の強さを持っています。", compat: "ISFP（気まぐれパンダ）", badCompat: "INFP（メンヘラコウモリ）" },
    ESFJ: { name: "社交的キャット", image: "images/pcat.png", desc: "気配り上手で誰からも愛される自然体なタイプ。場の空気を感じ取り、スムーズな関係性を築きます。", compat: "ISTP（マイペースネコ）", badCompat: "INTP（引きこもりフクロウ）" },
    ISTP: { name: "マイペースネコ", image: "images/wcat.png", desc: "自由を愛する冷静なタイプ。自分の時間を大切にし、干渉しすぎない適度な距離感を好みます。", compat: "ESFJ（社交的キャット）", badCompat: "ENFJ（おせっかいイヌ）" },
    ISFP: { name: "気まぐれパンダ", image: "images/panda.png", desc: "おだやかで柔軟な感性を持つタイプ。自分の「好き」という感覚を素直に大切にして過ごします。", compat: "ESTJ（毒舌ゴリラ）", badCompat: "ENTJ（暴君ライオン）" },
    ESTP: { name: "ウェイウェイドラゴン", image: "images/dragon.png", desc: "刺激や楽しさを求める行動派。直感的に素早く動くフットワークの軽さが持ち味です。", compat: "ISFJ（尽くしすぎクマ）", badCompat: "INFJ（達観ペンギン）" },
    ESFP: { name: "パリピカワウソ", image: "images/kawauso.png", desc: "周囲を巻き込んでその場を楽しくさせる明るさの持ち主。ポジティブなエネルギーで場を和ませます。", compat: "ISTJ（まじめタートル）", badCompat: "INTJ（孤高の戦略ウルフ）" }
  };

  var current = 0;
  var answers = [];

  var screens = {
    start: document.getElementById('screen-start'),
    question: document.getElementById('screen-question'),
    loading: document.getElementById('screen-loading'),
    result: document.getElementById('screen-result')
  };

  function showScreen(name) {
    Object.keys(screens).forEach(function(k){
      screens[k].classList.toggle('active', k === name);
    });
    window.scrollTo(0,0);
  }

  function renderQuestion() {
    var q = QUESTIONS[current];
    document.getElementById('progress-fill').style.width = ((current / QUESTIONS.length) * 100) + '%';
    document.getElementById('q-counter').textContent = 'Q.' + String(current + 1).padStart(2, '0');
    document.getElementById('q-text').textContent = q.text;
    document.getElementById('opt-a').textContent = q.a.text;
    document.getElementById('opt-b').textContent = q.b.text;
    document.getElementById('btn-back').style.visibility = current === 0 ? 'hidden' : 'visible';
  }

  function selectAnswer(letter) {
    answers[current] = letter;
    current++;
    if (current < QUESTIONS.length) {
      renderQuestion();
    } else {
      startJudging();
    }
  }

  document.getElementById('opt-a').addEventListener('click', function(){ selectAnswer(QUESTIONS[current].a.letter); });
  document.getElementById('opt-b').addEventListener('click', function(){ selectAnswer(QUESTIONS[current].b.letter); });

  document.getElementById('btn-back').addEventListener('click', function(){
    if (current > 0) { current--; renderQuestion(); }
  });

  function calcType() {
    var counts = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
    answers.forEach(function(l){ counts[l]++; });
    return (counts.E >= counts.I ? 'E':'I') +
           (counts.S >= counts.N ? 'S':'N') +
           (counts.T >= counts.F ? 'T':'F') +
           (counts.J >= counts.P ? 'J':'P');
  }

  function startJudging() {
    showScreen('loading');
    setTimeout(showResult, 1200);
  }

  function showResult() {
    var code = calcType();
    var m = MONSTERS[code];

    document.getElementById('monster-image').src = m.image;
    document.getElementById('result-type-code').textContent = 'TYPE : ' + code;
